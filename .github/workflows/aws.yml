name: Deploy Laravel App to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/mi_cicd_laravelapp

            # Si el repo no existe aún en el servidor, clónalo
            if [ ! -d ".git" ]; then
              git clone https://github.com/jtoledom1/mi_cicd_laravelapp.git .
            else
              git pull origin main
            fi

            # Instalar/actualizar dependencias
            composer install --no-dev --optimize-autoloader

            # Configurar permisos en storage y cache
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Ejecutar migraciones y optimizar caches de Laravel
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Reiniciar servicios
            sudo systemctl restart php8.3-fpm
